<!doctype html>
<html lang="zh-Hant">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10262b" />
    <meta
      name="description"
      content="台灣現代政治體制背景的架空政治 RPG。簽公文、追查弊案、參與選舉，決定自己的政治道路。"
    />
    <title>島嶼：權力之間</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310262b'/%3E%3Cpath d='M9 8h14v4H9zm0 6h14v4H9zm0 6h14v4H9z' fill='%23d5b67c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="config.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="map-data.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳至遊戲內容</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="島嶼：權力之間 首頁"
        ><span class="brandmark">島</span
        ><span>島嶼<span class="brand-sub">權力之間</span></span></a

      <div class="top-right">
        <span id="modeLabel" class="mode-label">POLITICAL ROLEPLAY</span
        ><button id="settingsBtn" class="quiet">存檔與連線</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog">
      <div id="dialogBody"></div>
      <button class="dialog-close" id="closeDialog" aria-label="關閉視窗">
        ×
      </button>
    </dialog>
    <noscript
      >這款遊戲需要開啟 JavaScript。請使用支援 JavaScript 的瀏覽器。</noscript
    >
  </body>
</html>
